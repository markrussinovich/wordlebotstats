<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Stat Explorer Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }
    
    #dashboard-root {
      min-height: 100vh;
    }

    /* Loading state styles */
    .dashboard-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e9ecef;
      border-top: 3px solid #6aaa64;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: #666;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="dashboard-root">
    <div class="dashboard-loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Wordle Stat Explorer...</div>
    </div>
  </div>
  <script type="module" src="./dashboard.tsx"></script>
</body>
</html>
