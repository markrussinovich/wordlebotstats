<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Stat Explorer</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #ffffff;
    }

    .popup-container {
      display: flex;
      flex-direction: column;
    }

    .popup-header {
      padding: 16px;
      background: linear-gradient(135deg, #6aaa64 0%, #538d4e 100%);
      color: white;
    }

    .popup-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .popup-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .refresh-btn {
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.15);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .refresh-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.25);
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .time-frame-picker {
      display: flex;
      gap: 4px;
    }

    .time-frame-btn {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .time-frame-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .time-frame-btn.active {
      background: white;
      color: #538d4e;
      border-color: white;
    }

    .popup-main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .loading, .error, .no-data {
      grid-column: 1 / -1;
      text-align: center;
      padding: 65px 40px 85px;
      color: #666;
    }
    
    .error {
      color: #d73027;
    }
    
    .notification {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border: 1px solid #f5c2c7;
      border-radius: 8px;
      background: #fff5f5;
      color: #8a1c1c;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }

    .notification.error {
      border-color: #f3b0b5;
      background: #fff1f2;
    }

    .notification-icon {
      font-size: 20px;
      line-height: 1;
      margin-top: 2px;
    }

    .notification-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .notification-title {
      font-size: 14px;
      font-weight: 600;
    }

    .notification-message {
      font-size: 12px;
      line-height: 1.5;
      color: #6b050f;
    }

    .notification-dismiss {
      background: transparent;
      border: none;
      color: #8a1c1c;
      font-size: 16px;
      cursor: pointer;
      padding: 2px;
      line-height: 1;
    }

    .notification-dismiss:hover {
      opacity: 0.7;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 48px 16px 56px;
      text-align: center;
    }

    .loading-spinner {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 4px solid rgba(83, 141, 78, 0.25);
      border-top-color: #538d4e;
      animation: popup-spin 0.9s linear infinite;
    }

    .loading-message {
      font-size: 13px;
      font-weight: 600;
      color: #3f3f3f;
      line-height: 1.5;
    }

    @keyframes popup-spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 48px 16px;
      text-align: center;
      color: #5c5c5c;
    }

    .empty-icon {
      font-size: 28px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      color: #3b3b3b;
    }

    .empty-message {
      font-size: 12px;
      line-height: 1.5;
      color: #6b6b6b;
      max-width: 200px;
    }

    .retry-button, .cta-button {
      margin-top: 12px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .retry-button {
      background: #6aaa64;
      color: white;
    }

    .retry-button:hover {
      background: #538d4e;

    }

    .cta-button {
      background: #f0f0f0;
      color: #333;
    }

    .cta-button:hover {
      background: #e0e0e0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      padding: 16px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #e9ecef;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #6aaa64;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      line-height: 1.4;
    }

    .popup-footer {
      padding: 12px 16px 8px;
      border-top: 1px solid rgba(255,255,255,0.2);
      background: linear-gradient(135deg, #6aaa64 0%, #538d4e 100%);
    }

    .dashboard-link {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: white;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dashboard-link:hover {
      background: rgba(255,255,255,0.2);
    }

    .dashboard-link:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: #9cc891;
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
      }

      .popup-container {
        background: #1e1e1e;
        color: #cccccc;
      }

      .popup-header {
        background: linear-gradient(135deg, #3a5f38 0%, #2d4a2b 100%);
      }

      .popup-main {
        background: #1e1e1e;
      }

      .loading, .no-data {
        color: #858585;
      }

      .error {
        color: #f48771;
      }

      .stat-card {
        background: #252526;
        border-color: #3e3e42;
      }

      .stat-value {
        color: #6aaa64;
      }

      .stat-label {
        color: #858585;
      }

      .help-text {
        color: #858585;
      }

      .popup-footer {
        background: linear-gradient(135deg, #3a5f38 0%, #2d4a2b 100%);
        border-color: rgba(255,255,255,0.1);
      }

      .cta-button {
        background: #374151;
        color: #f9fafb;
        border: 1px solid #4b5563;
      }

      .cta-button:hover {
        background: #4b5563;
      }
    }
  </style>
</head>
<body>
  <div id="popup-root"></div>
  <script src="./popup.js"></script>
</body>
</html>
