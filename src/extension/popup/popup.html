<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Stat Explorer</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #ffffff;
    }

    .popup-container {
      display: flex;
      flex-direction: column;
    }

    .popup-header {
      padding: 16px;
      background: linear-gradient(135deg, #6aaa64 0%, #538d4e 100%);
      color: white;
    }

    .popup-header h1 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 600;
    }

    .time-frame-picker {
      display: flex;
      gap: 4px;
    }

    .time-frame-btn {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .time-frame-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .time-frame-btn.active {
      background: white;
      color: #538d4e;
      border-color: white;
    }

    .popup-main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .loading, .error, .no-data {
      text-align: center;
      padding: 20px;
    }

    .loading {
      color: #666;
    }

    .error {
      color: #d73027;
    }

    .retry-button, .cta-button {
      margin-top: 12px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .retry-button {
      background: #6aaa64;
      color: white;
    }

    .retry-button:hover {
      background: #538d4e;
    }

    .cta-button {
      background: #f0f0f0;
      color: #333;
    }

    .cta-button:hover {
      background: #e0e0e0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      padding: 16px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #e9ecef;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #6aaa64;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      line-height: 1.4;
    }

    .popup-footer {
      padding: 12px 16px 8px;
      border-top: 1px solid #e9ecef;
    }

    .dashboard-link {
      width: 100%;
      padding: 10px;
      border: none;
      background: #6aaa64;
      color: white;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dashboard-link:hover {
      background: #538d4e;
    }
  </style>
</head>
<body>
  <div id="popup-root"></div>
  <script type="module" src="./popup.tsx"></script>
</body>
</html>
