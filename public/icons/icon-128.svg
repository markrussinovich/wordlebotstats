<!-- Extension icon 128x128 - High detail version -->
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient and shadow -->
  <defs>
    <linearGradient id="bgGradient128" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6aaa64"/>
      <stop offset="50%" style="stop-color:#5a9960"/>
      <stop offset="100%" style="stop-color:#538d4e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <circle cx="64" cy="64" r="64" fill="url(#bgGradient128)" filter="url(#shadow)"/>
  
  <!-- Letter tiles representing Wordle with shadows -->
  <g filter="url(#shadow)">
    <rect x="16" y="32" width="24" height="24" rx="3" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <rect x="52" y="32" width="24" height="24" rx="3" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <rect x="88" y="32" width="24" height="24" rx="3" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  </g>
  
  <!-- Letters W, S, E (Wordle Stat Explorer) -->
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">W</text>
  <text x="64" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">S</text>
  <text x="100" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">E</text>
  
  <!-- Statistics dashboard visualization -->
  
  <!-- Main trend line -->
  <g stroke="#fff" stroke-width="3" fill="none" opacity="0.9">
    <path d="M20 85 L28 80 L36 75 L44 78 L52 70 L60 65 L68 62"/>
  </g>
  
  <!-- Data points on trend line -->
  <circle cx="20" cy="85" r="2" fill="#fff"/>
  <circle cx="28" cy="80" r="2" fill="#fff"/>
  <circle cx="36" cy="75" r="2" fill="#fff"/>
  <circle cx="44" cy="78" r="2" fill="#fff"/>
  <circle cx="52" cy="70" r="2" fill="#fff"/>
  <circle cx="60" cy="65" r="2" fill="#fff"/>
  <circle cx="68" cy="62" r="2" fill="#fff"/>
  
  <!-- Bar chart representation -->
  <rect x="75" y="75" width="4" height="18" fill="#fff" opacity="0.9" rx="1"/>
  <rect x="81" y="70" width="4" height="23" fill="#fff" opacity="0.9" rx="1"/>
  <rect x="87" y="78" width="4" height="15" fill="#fff" opacity="0.9" rx="1"/>
  <rect x="93" y="65" width="4" height="28" fill="#fff" opacity="0.9" rx="1"/>
  <rect x="99" y="72" width="4" height="21" fill="#fff" opacity="0.9" rx="1"/>
  <rect x="105" y="68" width="4" height="25" fill="#fff" opacity="0.9" rx="1"/>
  
  <!-- Subtle grid lines -->
  <g stroke="#fff" stroke-width="0.5" opacity="0.3">
    <line x1="20" y1="65" x2="68" y2="65"/>
    <line x1="20" y1="75" x2="68" y2="75"/>
    <line x1="20" y1="85" x2="68" y2="85"/>
  </g>
  
  <!-- Achievement/stats icons -->
  <g fill="#fff" opacity="0.7">
    <!-- Trophy icon -->
    <path d="M20 100 L20 96 L18 96 L18 94 L22 94 L22 96 L20 96"/>
    <circle cx="20" cy="98" r="2"/>
    
    <!-- Target/bullseye -->
    <circle cx="28" cy="98" r="3" stroke="#fff" stroke-width="0.5" fill="none"/>
    <circle cx="28" cy="98" r="1.5" fill="#fff"/>
    
    <!-- Trend up arrow -->
    <path d="M35 100 L38 97 L35 94 L36 94 L38 96 L40 94 L41 94 L38 97 Z"/>
  </g>
</svg>