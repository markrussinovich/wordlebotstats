<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Stat Explorer</title>
  <style>
    body {
      width: 380px;
      height: fit-content;
      max-height: 530px;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #ffffff;
      overflow: hidden;
    }

    .popup-container {
      display: flex;
      flex-direction: column;
      height: fit-content;
    }

    .popup-header {
      padding: 12px 16px;
      background: linear-gradient(135deg, #6aaa64 0%, #538d4e 100%);
      color: white;
    }

    .popup-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .popup-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .refresh-btn {
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.15);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .refresh-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.25);
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .time-frame-picker {
      display: flex;
      gap: 4px;
      margin: 2px 16px 2px 16px;
      background: #6aaa64;
      padding: 3px;
      border-radius: 6px;
    }

    .time-frame-btn {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .time-frame-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .time-frame-btn.active {
      background: white;
      color: #538d4e;
      border-color: white;
    }

    .popup-main {
      flex: 1;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* Game Viewer */
    .game-viewer {
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      padding: 4px 16px;
    }

    .game-board-container {
      display: flex;
      justify-content: center;
      margin: 6px 0 0px 0;
    }

    .board-and-scores {
      display: grid;
      grid-template-columns: 45px 1fr 45px;
      align-items: start;
      width: 100%;
      gap: 12px;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border: 1px solid #d3d6da;
      background: white;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      transition: all 0.2s;
    }

    .nav-btn-large {
      width: 30px;
      height: 30px;
      font-size: 18px;
      margin-top: 20px;
      justify-self: center;
      align-self: start;
    }

    .nav-btn:not(:disabled) {
      background: #6aaa64;
      border-color: #6aaa64;
      color: white;
    }

    .nav-btn:hover:not(:disabled) {
      background: #5a9954;
      border-color: #5a9954;
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: #f0f0f0;
      border-color: #d3d6da;
      color: #333;
    }

    .game-info {
      text-align: center;
      margin-bottom: 2px;
    }

    .score-right-stacked {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      width: 45px;
      justify-self: center;
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .score-item .score-label {
      font-size: 9px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .score-item .score-value {
      font-size: 14px;
      font-weight: 700;
      color: #6aaa64;
    }

    .game-date {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 2px;
    }

    .game-result {
      font-size: 12px;
      font-weight: 500;
    }

    .game-result.won {
      color: #6aaa64;
    }

    .game-result.lost {
      color: #d73027;
    }

    .game-viewer-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .game-word {
      font-size: 18px;
      font-weight: 700;
      color: #6aaa64;
      margin-bottom: 4px;
      letter-spacing: 2px;
    }

    .game-word.lost {
      color: #d73027;
    }

    .game-board {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: fit-content;
      justify-self: center;
    }

    .board-row {
      display: flex;
      gap: 4px;
    }

    .board-cell {
      width: 28px;
      height: 28px;
      border: 1px solid #d3d6da;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .board-cell-correct {
      background: #6aaa64;
      border-color: #6aaa64;
    }

    .board-cell-present {
      background: #c9b458;
      border-color: #c9b458;
    }

    .board-cell-absent {
      background: #787c7e;
      border-color: #787c7e;
    }

    .board-cell-empty {
      background: #f0f0f0;
      border-color: #e0e0e0;
      color: transparent;
    }

    .no-games-message,
    .no-board {
      color: #666;
      font-size: 14px;
      padding: 20px;
    }

    .loading, .error, .no-data {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px 30px 80px;
      color: #666;
    }
    
    .error {
      color: #d73027;
    }
    
    .notification {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border: 1px solid #f5c2c7;
      border-radius: 8px;
      background: #fff5f5;
      color: #8a1c1c;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }

    .notification.error {
      border-color: #f3b0b5;
      background: #fff1f2;
    }

    .notification-icon {
      font-size: 20px;
      line-height: 1;
      margin-top: 2px;
    }

    .notification-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .notification-title {
      font-size: 14px;
      font-weight: 600;
    }

    .notification-message {
      font-size: 12px;
      line-height: 1.5;
      color: #6b050f;
    }

    .notification-dismiss {
      background: transparent;
      border: none;
      color: #8a1c1c;
      font-size: 16px;
      cursor: pointer;
      padding: 2px;
      line-height: 1;
    }

    .notification-dismiss:hover {
      opacity: 0.7;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 50px 16px 60px;
      text-align: center;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 3px solid rgba(83, 141, 78, 0.25);
      border-top-color: #538d4e;
      animation: popup-spin 0.9s linear infinite;
    }

    .loading-message {
      font-size: 12px;
      font-weight: 600;
      color: #6a6a6a;
      line-height: 1.4;
    }

    @keyframes popup-spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 48px 16px;
      text-align: center;
      color: #5c5c5c;
    }

    .empty-icon {
      font-size: 28px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      color: #3b3b3b;
    }

    .empty-message {
      font-size: 12px;
      line-height: 1.5;
      color: #6b6b6b;
      max-width: 200px;
    }

    .retry-button, .cta-button {
      margin-top: 12px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .retry-button {
      background: #6aaa64;
      color: white;
    }

    .retry-button:hover {
      background: #538d4e;

    }

    .cta-button {
      background: #f0f0f0;
      color: #333;
    }

    .cta-button:hover {
      background: #e0e0e0;
    }

    .last-game-section {
      margin-bottom: 16px;
      margin-left: 24px;
      margin-right: 24px;
      padding: 12px;
      background: #e6e7e8;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }

    .last-game-header {
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .last-game-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .last-game-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .last-game-label {
      color: #666;
      font-weight: 500;
    }

    .last-game-value {
      color: #333;
      font-weight: 600;
    }

    .last-game-value.won {
      color: #6aaa64;
    }

    .last-game-value.lost {
      color: #d73027;
    }

    .last-game-scores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .last-game-score {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px;
      background: white;
      border-radius: 4px;
      border: 1px solid #e9ecef;
    }

    .last-game-score-label {
      font-size: 10px;
      color: #666;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .last-game-score-value {
      font-size: 16px;
      font-weight: 700;
      color: #6aaa64;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 2px 16px 4px 16px;
    }

    .stat-card {
      padding: 16px 12px;
      background: #e6e7e8;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #e9ecef;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #6aaa64;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      line-height: 1.4;
    }

    .popup-footer {
      padding: 6px 16px 6px;
      border-top: 1px solid rgba(255,255,255,0.2);
      background: linear-gradient(135deg, #6aaa64 0%, #538d4e 100%);
    }

    .dashboard-link {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: white;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dashboard-link:hover {
      background: rgba(255,255,255,0.2);
    }

    .dashboard-link:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: #9cc891;
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
      }

      .popup-container {
        background: #1e1e1e;
        color: #cccccc;
      }

      .popup-header {
        background: linear-gradient(135deg, #3a5f38 0%, #2d4a2b 100%);
      }

      .popup-main {
        background: #1e1e1e;
      }

      .loading, .no-data {
        color: #858585;
      }

      .error {
        color: #f48771;
      }

      .last-game-section {
        background: #252526;
        border-color: #3e3e42;
      }

      .last-game-header {
        color: #aaa;
      }

      .last-game-label {
        color: #858585;
      }

      .last-game-value {
        color: #cccccc;
      }

      .last-game-value.won {
        color: #6aaa64;
      }

      .last-game-value.lost {
        color: #f48771;
      }

      .last-game-score {
        background: #1e1e1e;
        border-color: #3e3e42;
      }

      .last-game-score-label {
        color: #858585;
      }

      .stat-card {
        background: #252526;
        border-color: #3e3e42;
      }

      .stat-value {
        color: #6aaa64;
      }

      .stat-label {
        color: #858585;
      }

      .help-text {
        color: #858585;
      }

      .popup-footer {
        background: linear-gradient(135deg, #3a5f38 0%, #2d4a2b 100%);
        border-color: rgba(255,255,255,0.1);
      }

      .cta-button {
        background: #374151;
        color: #f9fafb;
        border: 1px solid #4b5563;
      }

      .cta-button:hover {
        background: #4b5563;
      }

      /* Game Viewer Dark Mode */
      .game-viewer {
        background: #252526;
        border-bottom-color: #3e3e42;
      }

      .nav-btn:not(:disabled) {
        background: #6aaa64;
        border-color: #6aaa64;
        color: white;
      }

      .nav-btn:hover:not(:disabled) {
        background: #5a9954;
        border-color: #5a9954;
      }

      .nav-btn:disabled {
        background: #2a2a2a;
        border-color: #3e3e42;
        color: #666;
      }

      .board-cell-empty {
        background: #2a2a2a;
        border-color: #3e3e42;
      }

      .score-item .score-label {
        color: #858585;
      }

      .game-date {
        color: #cccccc;
      }

      .board-cell {
        border-color: #3e3e42;
      }

      .score-label {
        color: #858585;
      }

      .no-games-message,
      .no-board {
        color: #858585;
      }
    }
  </style>
</head>
<body>
  <div id="popup-root"></div>
  <script src="./popup.js"></script>
</body>
</html>
