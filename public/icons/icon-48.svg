<!-- Extension icon 48x48 -->
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6aaa64"/>
      <stop offset="100%" style="stop-color:#538d4e"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="24" fill="url(#bgGradient)"/>
  
  <!-- Letter tiles representing Wordle -->
  <rect x="6" y="12" width="9" height="9" rx="1.5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="19" y="12" width="9" height="9" rx="1.5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="32" y="12" width="9" height="9" rx="1.5" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  
  <!-- Letters W, S, E (Wordle Stat Explorer) -->
  <text x="10.5" y="18.5" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#333" text-anchor="middle">W</text>
  <text x="23.5" y="18.5" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#333" text-anchor="middle">S</text>
  <text x="36.5" y="18.5" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#333" text-anchor="middle">E</text>
  
  <!-- Statistics visualization -->
  <g stroke="#fff" stroke-width="2" fill="none">
    <!-- Trend line -->
    <path d="M8 32 L12 30 L16 28 L20 29 L24 26 L28 24"/>
  </g>
  
  <!-- Bar chart -->
  <rect x="30" y="28" width="2" height="8" fill="#fff" opacity="0.9"/>
  <rect x="33" y="26" width="2" height="10" fill="#fff" opacity="0.9"/>
  <rect x="36" y="30" width="2" height="6" fill="#fff" opacity="0.9"/>
  <rect x="39" y="24" width="2" height="12" fill="#fff" opacity="0.9"/>
  
  <!-- Small decorative elements -->
  <circle cx="12" cy="30" r="1" fill="#fff"/>
  <circle cx="16" cy="28" r="1" fill="#fff"/>
  <circle cx="20" cy="29" r="1" fill="#fff"/>
  <circle cx="24" cy="26" r="1" fill="#fff"/>
</svg>